<script>
/* ════ أدوات مشتركة في المتصفح (الموقع واللوحة والخصوصية) ════ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
/* كل نص يُعرض في HTML يمر من هنا */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const latin = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function normPhone(p){ let s = latin(p).replace(/\D/g, ""); if (s.startsWith("00966")) s = s.slice(5); else if (s.startsWith("966")) s = s.slice(3); if (s.length === 9 && s[0] === "5") s = "0" + s; return s; }
const validPhone = p => /^05\d{8}$/.test(normPhone(p));
const intl = p => "966" + normPhone(p).slice(1);
const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
function approxT(t){ if (!/^\d\d:\d\d$/.test(t || "")) return ""; const [h, m] = t.split(":").map(Number); return "تقريباً " + (h % 12 || 12) + ":" + pad(m) + " " + (h < 12 ? "صباحاً" : "مساءً"); }
/* الموعد المحفوظ «بعد العشاء – 9:30 مساءً»، وإلا القديم «بعد العشاء (تقريباً 7:30 مساءً)» أو بالساعة */
const whenOf = b => b.slot || (b.prayer ? b.prayer + " (" + approxT(b.time) + ")" : "الساعة " + fmtTime(b.time));
function fmtTime(t){ if (!/^\d\d:\d\d$/.test(t || "")) return t || ""; const [h, m] = t.split(":").map(Number); return (h % 12 || 12) + ":" + pad(m) + " " + (h < 12 ? "ص" : "م"); }
function F(opts, loc){ try { return new Intl.DateTimeFormat(loc, Object.assign({ timeZone: "UTC" }, opts)); } catch (e) { return new Intl.DateTimeFormat("ar", Object.assign({ timeZone: "UTC" }, opts)); } }
const HL = "ar-SA-u-ca-islamic-umalqura-nu-latn";
const fWeek = F({ weekday: "long" }, "ar"), fWeekS = F({ weekday: "short" }, "ar"), fHijri = F({ day: "numeric", month: "long" }, HL),
  fHD = F({ day: "numeric" }, HL), fHM = F({ month: "long" }, HL), fGreg = F({ day: "numeric", month: "short" }, "ar-SA-u-ca-gregory-nu-latn");
const dateOf = k => new Date(k + "T12:00:00Z");
const dayLabel = k => { const d = dateOf(k); return fWeek.format(d) + " " + fHijri.format(d) + " هـ (" + fGreg.format(d) + ")"; };
const shortDay = k => { const d = dateOf(k); return fWeek.format(d) + " " + fHijri.format(d) + " هـ"; };
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const ss = { get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };

/* استدعاء الخادم: يرجع دائماً {ok, ...}
   في الموقع الجديد (GitHub Pages) يكون window.API رابط Apps Script، فيُرسل الطلب إليه مباشرة */
function rpc(fn, ...args){
  const fallback = { ok: false, error: "تعذّر الاتصال، تحقق من الإنترنت وحاول مرة أخرى." };
  if (window.API) return fetch(window.API, { method: "POST", body: JSON.stringify({ fn: fn, args: args }), credentials: "omit" })
    .then(r => r.json()).then(r => r || fallback).catch(() => fallback);
  return new Promise(res => {
    try {
      google.script.run.withSuccessHandler(r => res(r || fallback)).withFailureHandler(() => res(fallback))[fn](...args);
    } catch (e) { res(fallback); }
  });
}
/* زر مشغول أثناء الطلب */
async function busy(btn, fn){
  if (btn.disabled) return;
  const old = btn.innerHTML; btn.disabled = true; btn.setAttribute("aria-busy", "true");
  try { return await fn(); } finally { btn.disabled = false; btn.removeAttribute("aria-busy"); btn.innerHTML = old; }
}

/* الوضع الصباحي والمسائي */
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  ls.set("theme", t);
  $$("[data-theme-btn]").forEach(b => { b.innerHTML = t === "dark" ? '<svg><use href="#i-sun"/></svg>صباحي' : '<svg><use href="#i-moon"/></svg>مسائي'; b.setAttribute("aria-label", t === "dark" ? "الوضع الصباحي" : "الوضع المسائي"); });
}
function initTheme(){
  const saved = ls.get("theme"), dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark ? "dark" : "light");
  $$("[data-theme-btn]").forEach(b => b.onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
}
/* شعار المأذون إن وُجد (الرابط متحقق منه في الخادم: https بلا علامات اقتباس) */
function applyLogo(url){ if (url && /^https:\/\/[^\s"'<>`\\]+$/.test(url)) document.documentElement.style.setProperty("--logo-img", 'url("' + url + '")'); }
</script>
